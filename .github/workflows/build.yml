name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Rodar testes do cofre
        run: |
          pip install cryptography
          PYTHONPATH=. python tests/test_vault.py

      - name: Cache do Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Instalar Buildozer
        run: pip install buildozer "cython<3"

      - name: Gerar APK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          buildozer -v android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: cofre-de-notas-apk
          path: bin/*.apk
